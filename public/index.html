<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>500gms/5kms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>500gms<span>/</span>5kms</h1>
    <p class="tagline">Tiny stuff. Nearby. Fast.</p>
  </header>

  <section id="delivery-check">
    <button id="check-location">Check delivery to my location</button>
    <span id="delivery-status"></span>
  </section>

  <main id="catalog"></main>

  <aside id="cart">
    <h2>Cart</h2>
    <ul id="cart-items"></ul>
    <p>Total weight: <span id="cart-weight">0</span>g</p>
    <p>Total: ₹<span id="cart-total">0</span></p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
